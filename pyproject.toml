[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-mechanics"
version = "0.1.0"
description = "A build-first portfolio-management mechanics trainer: FICC and equity analytics, derived, coded, and tested"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "cvxpy>=1.5",
    "pydantic>=2.8",
    "jupyterlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-jupyter>=0.25",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Notebooks intentionally contain unfinished MANUAL FIRST cells (see AGENTS.md);
# linting them would flag pedagogical scaffolding as errors.
extend-exclude = ["notebooks"]
